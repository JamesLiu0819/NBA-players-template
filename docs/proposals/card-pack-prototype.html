<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>每日球員卡 — 試玩版</title>
<!--
  用途：每日球員卡抽卡的試玩版，給網站擁有者感受開包流程、動畫、音效、機率夠不夠吸引人。
  不是正式網站的程式；定案後正式版的抽卡邏輯要放進 src/engine（純函數 + 單元測試），
  抽卡結果存在資料庫。球員與等級是 2026-11-01 的資料快照。
  這裡的「抽卡」用「使用者代號 + 第幾天」算出固定結果，同一天重新整理結果不變，跟正式版的規則一樣。
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #0e1118; --panel: #181d28; --line: #2a3142; --ink: #eef1f6; --soft: #9aa3b5;
    --common: #9aa4b6; --rare: #39a8ff; --epic: #b05cff; --legend: #ffc93c;
    --wood: #c9822b;
    --display: "Big Shoulders Display", "Arial Narrow", "PingFang TC", "Noto Sans TC", sans-serif;
    --body: "Noto Sans TC", -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--night); color: var(--ink); font: 15px/1.6 var(--body); }
  body { min-height: 100vh; overflow-x: hidden; }
  body::before { /* faint hardwood planks under the night */
    content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .07;
    background: repeating-linear-gradient(90deg, #c9822b 0 46px, #a96a20 46px 47px, #b8772a 47px 93px, #9c6220 93px 94px);
  }
  button { font: inherit; cursor: pointer; color: inherit; }
  button:focus-visible, .card:focus-visible { outline: 3px solid var(--legend); outline-offset: 3px; }
  .wrap { position: relative; max-width: 980px; margin: 0 auto; padding: 14px 16px 80px; }

  /* ---------- top strip ---------- */
  .strip { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: space-between; }
  .brand { font: 900 1.05rem/1 var(--body); letter-spacing: .04em; }
  .brand small { display: block; font: 600 .72rem/1.4 var(--display); letter-spacing: .22em; color: var(--soft); text-transform: uppercase; }
  .stats { display: flex; gap: 18px; align-items: center; }
  .stat { text-align: right; }
  .stat b { display: block; font: 900 1.7rem/1 var(--display); letter-spacing: .02em; }
  .stat span { font-size: .74rem; color: var(--soft); }
  .stat.streak b { color: var(--wood); }
  .bar { height: 6px; border-radius: 4px; background: var(--line); overflow: hidden; margin-top: 10px; }
  .bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--rare), var(--epic), var(--legend)); transition: width 1.2s cubic-bezier(.2,.8,.2,1); }
  .pity { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font-size: .8rem; color: var(--soft); }
  .pity b { color: var(--ink); }

  /* ---------- stage ---------- */
  .stage { position: relative; min-height: 480px; display: grid; place-items: center; margin-top: 18px; }
  .hint { position: absolute; bottom: 6px; left: 0; right: 0; text-align: center; color: var(--soft); font-size: .9rem; }
  .hint b { color: var(--ink); }

  /* the foil pack */
  .packs { display: flex; gap: 26px; justify-content: center; align-items: flex-end; flex-wrap: nowrap; }
  .pack {
    --glow: #ffffff; position: relative; width: 190px; height: 272px; border: 0; padding: 0; background: none; flex: none;
    filter: drop-shadow(0 24px 40px rgba(0,0,0,.55)); animation: float 3.4s ease-in-out infinite;
    transition: transform .35s cubic-bezier(.2,.8,.2,1), opacity .35s, margin .45s;
  }
  .pack:nth-child(2) { animation-delay: -1.1s; } .pack:nth-child(3) { animation-delay: -2.2s; }
  .packs:not(.chosen) .pack:hover, .packs:not(.chosen) .pack:focus-visible { animation-play-state: paused; transform: translateY(-18px) scale(1.04); }
  .packs.chosen .pack:not(.picked) { opacity: 0; transform: translateY(60px) scale(.8); pointer-events: none; }
  .packs.chosen .pack.picked { transform: scale(1.18); }
  .pack .body {
    position: absolute; inset: 0;
    clip-path: polygon(0 4%, 4% 0, 8% 4%, 12% 0, 16% 4%, 20% 0, 24% 4%, 28% 0, 32% 4%, 36% 0, 40% 4%, 44% 0, 48% 4%, 52% 0, 56% 4%, 60% 0, 64% 4%, 68% 0, 72% 4%, 76% 0, 80% 4%, 84% 0, 88% 4%, 92% 0, 96% 4%, 100% 0, 100% 100%, 96% 96%, 92% 100%, 88% 96%, 84% 100%, 80% 96%, 76% 100%, 72% 96%, 68% 100%, 64% 96%, 60% 100%, 56% 96%, 52% 100%, 48% 96%, 44% 100%, 40% 96%, 36% 100%, 32% 96%, 28% 100%, 24% 96%, 20% 100%, 16% 96%, 12% 100%, 8% 96%, 4% 100%, 0 96%);
    background:
      linear-gradient(115deg, transparent 30%, rgba(255,255,255,.28) 45%, transparent 60%) 0 0 / 260% 100%,
      linear-gradient(160deg, #262d3d, #11151d 55%, #1f2533);
    animation: sheen 3.2s linear infinite;
  }
  .pack .seam { position: absolute; left: 6%; right: 6%; top: 15%; height: 3px; border-radius: 3px; background: var(--glow); box-shadow: 0 0 10px var(--glow), 0 0 26px var(--glow); opacity: .35; transition: opacity .3s; }
  .pack .tear { position: absolute; inset: 0 0 auto 0; height: 15%; clip-path: inherit; }
  .pack .tear::after { content: "沿這裡撕開 ⟶"; position: absolute; right: 12px; top: 40%; font: 700 .7rem var(--body); color: var(--soft); letter-spacing: .08em; }
  .pack .label { position: absolute; inset: 22% 10% auto; text-align: center; }
  .pack .label > span { display: block; }
  .pack .label .eyebrow { font: 800 .78rem/1 var(--display); letter-spacing: .32em; color: var(--wood); }
  .pack .label .title { font: 900 2.2rem/.95 var(--display); letter-spacing: .02em; margin-top: 10px; }
  .pack .label .zh { font: 900 1.2rem/1.2 var(--body); margin-top: 8px; }
  .pack .label .count { margin-top: 14px; font: 800 .9rem/1 var(--display); letter-spacing: .2em; color: var(--soft); }
  .pack .ball { position: absolute; left: 50%; bottom: 8%; width: 70px; height: 70px; margin-left: -35px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #f0a24a, #c46c17 60%, #7a3d08);
    box-shadow: inset 0 0 0 2px rgba(0,0,0,.35); }
  .pack .ball::before, .pack .ball::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(20,10,0,.55); clip-path: inset(0 48% 0 48%); }
  .pack .ball::after { clip-path: inset(48% 0 48% 0); }
  .pack.charging { animation: none; }
  .pack.charging .seam { opacity: 1; }
  .pack.shaking { animation: shake .07s linear infinite; }
  .pack.torn .tear { animation: flyoff .6s cubic-bezier(.3,.6,.2,1) forwards; }
  .pack.gone { animation: drop .45s ease-in forwards; }
  @keyframes float { 50% { transform: translateY(-10px) rotate(-1deg); } }
  @keyframes sheen { to { background-position: -260% 0, 0 0; } }
  @keyframes shake { 0% { transform: translate(0,0) rotate(0); } 25% { transform: translate(-3px,1px) rotate(-1.5deg); } 50% { transform: translate(3px,-1px) rotate(1.5deg); } 75% { transform: translate(-2px,-1px) rotate(-1deg); } }
  @keyframes flyoff { to { transform: translate(140px,-160px) rotate(38deg); opacity: 0; } }
  @keyframes drop { to { transform: translateY(70px) scale(.85); opacity: 0; } }

  .burst { position: absolute; width: 10px; height: 10px; border-radius: 50%; pointer-events: none; opacity: 0; }
  .burst.go { animation: burst .8s ease-out forwards; }
  @keyframes burst { 0% { opacity: .95; transform: scale(1); } 100% { opacity: 0; transform: scale(70); } }

  /* ---------- cards ---------- */
  .row { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; perspective: 1200px; }
  .stack { position: relative; width: 220px; height: 320px; margin: 0 auto; perspective: 1400px; touch-action: none; }
  .stack .card { position: absolute; inset: 0; width: 100%; height: 100%; }
  .stack .card[data-depth="1"] { transform: translate(10px, 10px) rotate(2.5deg); }
  .stack .card[data-depth="2"] { transform: translate(20px, 20px) rotate(5deg); }
  .stack .card.flipped { transform: rotateY(180deg); }
  .stack .card.hero { transform: rotateY(180deg) scale(1.12); }
  .stack .card.away { transform: translateX(var(--away, -140%)) rotate(var(--spin, -18deg)) rotateY(180deg); opacity: 0; pointer-events: none;
    transition: transform .5s cubic-bezier(.4,0,.2,1), opacity .5s; }
  .stack .card.dragging { transition: none; }
  .counter { text-align: center; margin-top: 18px; font: 800 1rem var(--display); letter-spacing: .18em; color: var(--soft); }
  .summary { display: flex; gap: 10px; justify-content: center; margin-top: 18px; }
  .summary .card { width: 120px; height: 174px; animation: none; pointer-events: none; }
  .summary .front .name { font-size: 1rem; } .summary .front svg { width: 54px; height: 54px; } .summary .front .meta, .summary .arch { font-size: .6rem; } .summary .tier, .summary .num { font-size: .6rem; }
  .summary .new { display: none; }
  .card { --c: var(--common); position: relative; width: 200px; height: 290px; border: 0; padding: 0; background: none; transform-style: preserve-3d;
    transition: transform .7s cubic-bezier(.2,.9,.25,1.15); animation: dealt .55s cubic-bezier(.2,.8,.2,1) backwards; }
  .card:nth-child(2) { animation-delay: .12s; } .card:nth-child(3) { animation-delay: .24s; }
  @keyframes dealt { from { transform: translateY(160px) rotate(-8deg) scale(.6); opacity: 0; } }
  .card.flipped { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; border-radius: 14px; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; }
  .back { background: linear-gradient(150deg, #232a3a, #121620); border: 2px solid #343c50; display: grid; place-items: center; }
  .back .mark { font: 900 2.4rem/1 var(--display); color: #3a4358; letter-spacing: .06em; }
  .back .q { position: absolute; bottom: 14px; font: 700 .75rem var(--body); color: var(--soft); }
  .front { transform: rotateY(180deg); background: linear-gradient(170deg, #1d2330, #0f131b); border: 3px solid var(--c); padding: 12px 12px 10px; display: flex; flex-direction: column; text-align: left; }
  .front .top { display: flex; justify-content: space-between; align-items: center; }
  .tier { font: 900 .74rem/1 var(--body); color: #0e1118; background: var(--c); border-radius: 999px; padding: 4px 9px; letter-spacing: .06em; }
  .num { font: 800 .82rem/1 var(--display); color: var(--soft); letter-spacing: .08em; }
  .front svg { display: block; margin: 6px auto 2px; }
  .front .name { font: 900 1.55rem/1 var(--display); letter-spacing: .01em; margin-top: auto; overflow-wrap: anywhere; }
  .front .meta { font-size: .78rem; color: var(--soft); margin-top: 4px; }
  .front .arch { display: inline-block; margin-top: 6px; font: 700 .74rem var(--body); color: var(--c); border: 1px solid var(--c); border-radius: 6px; padding: 1px 7px; width: max-content; }
  .new { position: absolute; top: -10px; left: -10px; z-index: 3; font: 900 .8rem/1 var(--display); letter-spacing: .12em; background: #ff4d4d; color: #fff; padding: 6px 9px; border-radius: 8px; transform: rotateY(180deg) rotate(-12deg) scale(0); transition: transform .35s cubic-bezier(.3,1.6,.5,1) .55s; }
  .card.flipped .new { transform: rotateY(180deg) rotate(-12deg) scale(1); }
  .t-rare { --c: var(--rare); } .t-epic { --c: var(--epic); } .t-legend { --c: var(--legend); }
  /* glow lives on the front face: a filter on the 3D card itself would flatten it and break the flip */
  .card.flipped.t-rare .front { box-shadow: 0 0 18px rgba(57,168,255,.6); }
  .card.flipped.t-epic .front { box-shadow: 0 0 26px rgba(176,92,255,.8); animation: epicPulse 1.6s ease-in-out .7s 2; }
  @keyframes epicPulse { 50% { box-shadow: 0 0 46px rgba(176,92,255,1); } }
  /* the prizm refractor: only legends get it */
  .t-legend .front { background: linear-gradient(165deg, #4a3810, #1d160a 45%, #2e230b); }
  /* one wide non-repeating stripe that slides across; a repeating tile would show its seams as hard rectangles */
  .t-legend .front::after { content: ""; position: absolute; top: 0; bottom: 0; left: -100%; width: 300%; mix-blend-mode: screen; opacity: .28; pointer-events: none;
    background: linear-gradient(115deg, transparent 30%, #ff6ad5 40%, #c774e8 44%, #ad8cff 48%, #8795e8 52%, #94d0ff 56%, transparent 66%) no-repeat;
    animation: prizm 2.6s linear infinite; }
  @keyframes prizm { from { transform: translateX(-34%); } to { transform: translateX(34%); } }
  .card.flipped.t-legend { z-index: 5; }
  .card.flipped.t-legend .front { box-shadow: 0 0 40px rgba(255,201,60,.9), 0 0 90px rgba(255,201,60,.45); }
  .card.hero { transform: rotateY(180deg) scale(1.12); }

  /* legend overlay */
  .veil { position: fixed; inset: 0; z-index: 4; pointer-events: none; opacity: 0; background: radial-gradient(circle at 50% 50%, rgba(255,201,60,.18), rgba(5,6,10,.86) 60%); transition: opacity .4s; }
  .veil.on { opacity: 1; }
  .rays { position: fixed; left: 50%; top: 50%; width: 140vmax; height: 140vmax; margin: -70vmax 0 0 -70vmax; z-index: 4; pointer-events: none; opacity: 0;
    background: repeating-conic-gradient(from 0deg, rgba(255,201,60,.16) 0 6deg, transparent 6deg 18deg); transition: opacity .5s; animation: spin 14s linear infinite; }
  .rays.on { opacity: 1; }
  @keyframes spin { to { transform: rotate(360deg); } }
  canvas#fx { position: fixed; inset: 0; z-index: 6; pointer-events: none; }
  .shake-screen { animation: screen .45s linear; }
  @keyframes screen { 20% { transform: translate(-6px,2px); } 40% { transform: translate(5px,-3px); } 60% { transform: translate(-4px,3px); } 80% { transform: translate(3px,-2px); } }

  /* ---------- after ---------- */
  .after { text-align: center; margin-top: 22px; }
  .after h2 { margin: 0; font: 900 1.25rem var(--body); }
  .after .next { font: 800 1.6rem/1 var(--display); letter-spacing: .08em; color: var(--wood); margin: 8px 0 2px; }
  .btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 9px 16px; border-radius: 10px; font-weight: 700; }
  .btn.main { background: var(--wood); border-color: var(--wood); color: #1a1006; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 14px; }

  /* ---------- album ---------- */
  section.album { margin-top: 44px; }
  .album h2 { font: 900 1.3rem var(--body); margin: 0 0 4px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 12px; }
  .tab { border: 2px solid var(--line); background: transparent; color: var(--ink); padding: 4px 12px; border-radius: 999px; font-weight: 700; font-size: .85rem; }
  .tab.on { border-color: var(--c, var(--ink)); color: var(--c, var(--ink)); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
  .mini { --c: var(--common); border-radius: 8px; border: 2px solid var(--c); padding: 6px; min-height: 92px; background: #141924; display: flex; flex-direction: column; justify-content: space-between; }
  .mini b { font: 800 .9rem/1.05 var(--display); overflow-wrap: anywhere; }
  .mini span { font: 700 .66rem var(--display); color: var(--soft); letter-spacing: .08em; }
  .mini.locked { border-style: dashed; border-color: #2c3344; background: repeating-linear-gradient(45deg, #121621 0 6px, #151a26 6px 12px); }
  .mini.locked b { color: #3a4255; }

  .odds { margin-top: 36px; border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; background: var(--panel); font-size: .88rem; }
  .odds h3 { margin: 0 0 6px; font: 900 1rem var(--body); }
  .odds table { width: 100%; border-collapse: collapse; }
  .odds td, .odds th { padding: 5px 6px; border-bottom: 1px solid var(--line); text-align: left; }
  .odds .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--c); margin-right: 6px; }
  .proto { margin-top: 26px; border: 1px dashed #4a5268; border-radius: 12px; padding: 10px 14px; font-size: .85rem; color: var(--soft); }
  .proto b { color: var(--ink); }
  .proto .actions { justify-content: flex-start; }
  .sound { border: 1px solid var(--line); background: transparent; color: var(--soft); border-radius: 999px; padding: 4px 10px; font-size: .8rem; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  }
  @media (max-width: 520px) {
    .packs { gap: 10px; } .pack { width: calc((100vw - 52px) / 3); height: calc((100vw - 52px) / 3 * 1.43); }
    .pack .label .title { font-size: 1.35rem; } .pack .label .zh { font-size: .8rem; } .pack .label .count, .pack .label .eyebrow { font-size: .6rem; letter-spacing: .14em; }
    .pack .ball { width: 40px; height: 40px; margin-left: -20px; } .pack .tear::after { display: none; }
    .stack { width: 62vw; height: 90vw; }
    .summary .card { width: calc((100vw - 52px) / 3); height: calc((100vw - 52px) / 3 * 1.45); }
    .stats { gap: 10px; } .stat b { font-size: 1.35rem; }
    .row { gap: 8px; }
    .front .name { font-size: 1.05rem; } .front svg { width: 64px; height: 64px; }
    .front .meta { font-size: .66rem; } .front .arch, .tier { font-size: .62rem; } .num { font-size: .66rem; }
  }
</style>
</head>
<body>
<div class="veil" id="veil"></div>
<div class="rays" id="rays"></div>
<canvas id="fx"></canvas>
<div class="wrap" id="wrap">

  <div class="strip">
    <div class="brand">每日球員卡<small>Scouting Report · Daily Pack</small></div>
    <div class="stats">
      <div class="stat streak"><b id="streak">0</b><span>連續天數</span></div>
      <div class="stat"><b id="owned">0</b><span>/ <span id="total"></span> 張</span></div>
      <button class="sound" id="sound" aria-pressed="true">🔊 音效開</button>
    </div>
  </div>
  <div class="bar"><i id="bar"></i></div>
  <div class="pity" id="pity"></div>

  <div class="stage" id="stage"></div>

  <section class="album" aria-labelledby="album-title">
    <h2 id="album-title">收藏冊</h2>
    <div class="tabs" id="tabs"></div>
    <div class="grid" id="grid"></div>
  </section>

  <div class="odds">
    <h3>機率公開</h3>
    <table id="odds"></table>
    <p style="margin:8px 0 0;color:var(--soft)">每張卡各自抽一次等級。同一張卡不會抽到兩次；某個等級收齊後，它的機率分給其他等級。每天一包，以台灣時間午夜換日。</p>
  </div>

  <div class="proto">
    <b>試玩用控制（正式版不會有）</b>：正式版一天只能開一包。這裡可以直接跳到下一天，快速感受收集的過程。
    <div class="actions">
      <button class="btn" id="next-day">跳到下一天</button>
      <button class="btn" id="force-legend">下一包保證出傳奇</button>
      <button class="btn" id="reset">清空收藏重來</button>
    </div>
  </div>
</div>

const TIERS = [
  { key: "common", name: "普通", rate: 0.55, color: "var(--common)" },
  { key: "rare", name: "稀有", rate: 0.30, color: "var(--rare)" },
  { key: "epic", name: "史詩", rate: 0.12, color: "var(--epic)" },
  { key: "legend", name: "傳奇", rate: 0.03, color: "var(--legend)" },
];
const RANK = { common: 0, rare: 1, epic: 2, legend: 3 };
const LEGEND_PITY_DAYS = 14;   // 連續 14 天沒開到傳奇，第 14 天的第 3 張保證傳奇
const STREAK_PITY_EVERY = 7;   // 連續登入每第 7 天，保證至少一張史詩
const AX = ["A", "B1", "B2", "D", "C2", "C1"]; // radar order around the hexagon
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const byTier = {}; for (const t of TIERS) byTier[t.key] = DATA.players.filter((p) => p.tier === t.key);
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;

// ---------- deterministic randomness: same user + same day -> same pack ----------
function fnv(str) { let h = 0x811c9dc5; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h >>> 0; }
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

// ---------- state (prototype keeps it in the browser; the real one lives in the database) ----------
const KEY = "card-pack-prototype:" + DATA.snapshot;
function load() { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch (e) { return null; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* 存不了就只在這個分頁有效 */ } }
let S = load() || { user: "demo", day: 1, opened: 0, owned: [], streak: 0, sinceLegend: 0, forceLegend: false };
let sound = true;

function drawPack(day, k) {
  const r = rng(fnv(S.user + "|" + day + "|" + k));
  const owned = new Set(S.owned);
  const left = (t) => byTier[t].filter((p) => !owned.has(p.id));
  const picks = [];
  const streakDay = S.streak + 1;
  for (let slot = 0; slot < 3; slot++) {
    const avail = TIERS.filter((t) => left(t.key).length > 0);
    if (!avail.length) break;
    let tier = null;
    const best = picks.reduce((m, p) => Math.max(m, RANK[p.tier]), -1);
    if (slot === 2) {
      if ((S.forceLegend || S.sinceLegend >= LEGEND_PITY_DAYS - 1) && left("legend").length && best < 3) tier = "legend";
      else if (streakDay % STREAK_PITY_EVERY === 0 && best < 2) tier = left("epic").length ? "epic" : (left("legend").length ? "legend" : null);
    }
    if (!tier) {
      const total = avail.reduce((s, t) => s + t.rate, 0); let x = r() * total;
      for (const t of avail) { x -= t.rate; if (x <= 0) { tier = t.key; break; } }
      tier = tier || avail[avail.length - 1].key;
    }
    const pool = left(tier).filter((p) => !picks.includes(p));
    if (!pool.length) { slot--; continue; }
    const card = pool[Math.floor(r() * pool.length)];
    picks.push(card); owned.add(card.id);
  }
  return picks.sort((a, b) => RANK[a.tier] - RANK[b.tier] || a.no - b.no); // weakest first, best saved for last
}

// ---------- sound (synthesised, no files) ----------
let ac = null;
function audio() { if (!sound) return null; ac = ac || new (window.AudioContext || window.webkitAudioContext)(); return ac; }
function tone(freq, t0, dur, type = "triangle", gain = 0.18) {
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, a.currentTime + t0); g.gain.exponentialRampToValueAtTime(gain, a.currentTime + t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + t0 + dur);
  o.connect(g).connect(a.destination); o.start(a.currentTime + t0); o.stop(a.currentTime + t0 + dur + 0.05);
}
function noise(dur, gain = 0.25) {
  const a = audio(); if (!a) return;
  const buf = a.createBuffer(1, a.sampleRate * dur, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  f.type = "highpass"; f.frequency.value = 1800; g.gain.value = gain; src.buffer = buf; src.connect(f).connect(g).connect(a.destination); src.start();
}
const SFX = {
  charge(level) { for (let i = 0; i < 6 + level * 3; i++) tone(180 + i * (40 + level * 25), i * 0.09, 0.12, "sawtooth", 0.04 + level * 0.01); },
  tear() { noise(0.35, 0.3); },
  flip() { tone(880, 0, 0.06, "square", 0.05); },
  common() { tone(523, 0, 0.25); },
  rare() { tone(659, 0, 0.22); tone(988, 0.1, 0.35); },
  epic() { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.08, 0.4)); },
  legend() { [392, 523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i * 0.09, 0.55, "triangle", 0.2)); [1568, 2093].forEach((f, i) => tone(f, 0.7 + i * 0.12, 1.2, "sine", 0.08)); },
};
function buzz(pattern) { if (!REDUCED && navigator.vibrate) navigator.vibrate(pattern); }

// ---------- confetti / sparks ----------
const fx = $("fx"), ctx = fx.getContext("2d"); let parts = [];
function sizeFx() { fx.width = innerWidth * devicePixelRatio; fx.height = innerHeight * devicePixelRatio; ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); }
addEventListener("resize", sizeFx); sizeFx();
function spray(x, y, n, colors, spread = 1) {
  if (REDUCED) return;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = (3 + Math.random() * 7) * spread;
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 4, life: 70 + Math.random() * 50, c: colors[i % colors.length], s: 3 + Math.random() * 5, r: Math.random() * 6 });
  }
  if (parts.length === n) requestAnimationFrame(tick);
}
function tick() {
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  parts = parts.filter((p) => p.life-- > 0);
  for (const p of parts) { p.vy += 0.18; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += 0.2;
    ctx.save(); ctx.globalAlpha = Math.min(1, p.life / 40); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); }
  if (parts.length) requestAnimationFrame(tick); else ctx.clearRect(0, 0, innerWidth, innerHeight);
}
function center(el) { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; }

// ---------- rendering ----------
const tierOf = (k) => TIERS.find((t) => t.key === k);
function radar(c, size = 92) {
  const R = size / 2 - 6, cx = size / 2, cy = size / 2;
  const pt = (i, v) => { const a = -Math.PI / 2 + i * Math.PI / 3; return [cx + Math.cos(a) * R * v / 100, cy + Math.sin(a) * R * v / 100]; };
  const ring = AX.map((_, i) => pt(i, 100).join(",")).join(" ");
  const shape = AX.map((ax, i) => pt(i, Math.max(c[ax], 4)).join(",")).join(" ");
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><polygon points="${ring}" fill="none" stroke="#3a4255"/><polygon points="${shape}" fill="var(--c)" fill-opacity=".35" stroke="var(--c)" stroke-width="2"/></svg>`;
}
function cardHtml(p, isNew) {
  const t = tierOf(p.tier);
  return `<button class="card t-${p.tier}" data-id="${esc(p.id)}" aria-label="翻開卡片">

      <span class="top"><span class="tier">${t.name}</span><span class="num">#${String(p.no).padStart(3, "0")} / ${DATA.players.length}</span></span>
      ${radar(p.c)}
      <span class="name">${esc(p.n)}</span>
      <span class="meta">${esc(p.t)}${p.pool === "h" ? "・歷史" : ""}　招牌：${esc(p.s)}</span>

}

function header() {
  $("total").textContent = DATA.players.length;
  $("owned").textContent = S.owned.length;
  $("streak").textContent = S.streak;
  $("bar").style.width = (S.owned.length / DATA.players.length * 100).toFixed(1) + "%";
  const toStreakPity = STREAK_PITY_EVERY - (S.streak % STREAK_PITY_EVERY);
  const toLegendPity = Math.max(1, LEGEND_PITY_DAYS - S.sinceLegend);
  $("pity").innerHTML = `<span>再 <b>${toStreakPity}</b> 天連續登入：保證一張<b style="color:var(--epic)">史詩</b>以上</span><span>最晚 <b>${toLegendPity}</b> 天內：保證一張<b style="color:var(--legend)">傳奇</b></span>`;
}

function showPacks() {
  // Three packs, all fixed by user + day; the one you pick is the one you get.
  const packs = [0, 1, 2].map((k) => drawPack(S.day, k));
  $("stage").innerHTML = `
    <div style="width:100%">
      <div class="packs" id="packs">${packs.map((_, k) => `
        <button class="pack" data-k="${k}" aria-label="選第 ${k + 1} 包">
          <span class="body"></span><span class="tear"></span><span class="seam"></span>
          <span class="label"><span class="eyebrow">DAY ${S.day}</span><span class="title">DAILY<br>PACK</span><span class="zh">今日卡包</span><span class="count">3 CARDS</span></span>
          <span class="ball"></span>
        </button>`).join("")}</div>
      <p class="hint" style="position:static;margin-top:22px">三包裡選一包。<b>每一包裡面都不一樣</b>，選了就不能換。</p>
    </div>`;
  document.querySelectorAll("#packs .pack").forEach((el) => el.addEventListener("click", () => pickPack(el, packs[+el.dataset.k]), { once: true }));

function pickPack(el, pack) {
  if ($("packs").classList.contains("chosen")) return;
  $("packs").classList.add("chosen"); el.classList.add("picked");
  document.querySelector(".hint").textContent = "撕開中…";
  setTimeout(() => openPack(el, pack), REDUCED ? 0 : 500);
}

function openPack(el, pack) {

    el.classList.remove("shaking"); el.classList.add("torn"); SFX.tear();
    const [x, y] = center(el), b = document.createElement("span");
    b.className = "burst"; b.style.cssText = `left:${x}px;top:${y}px;position:fixed;background:#ffffff`;
    document.body.appendChild(b); requestAnimationFrame(() => b.classList.add("go")); setTimeout(() => b.remove(), 900);
    setTimeout(() => { el.classList.add("gone"); setTimeout(() => dealStack(pack), 380); }, 450);
  }, REDUCED ? 50 : 1100);
}

function dealStack(pack) {
  const ownedBefore = new Set(S.owned);
  // DOM order = bottom to top, so the weakest card (pack[0]) ends up on top and the best is last.
  const order = pack.slice().reverse();
  $("stage").innerHTML = `<div style="width:100%">
      <div class="stack" id="stack">${order.map((p) => cardHtml(p, !ownedBefore.has(p.id))).join("")}</div>
      <div class="counter" id="counter"></div>
      <p class="hint" id="stack-hint" style="position:static;margin-top:6px">點卡片翻開，再點一次（或往旁邊滑掉）看下一張。</p>
      <div class="actions"><button class="btn" id="flip-all">自動翻完</button></div><div id="after"></div></div>`;
  let index = 0; // how many cards have been dismissed
  const cards = () => [...document.querySelectorAll("#stack .card")].reverse(); // top first
  const layout = () => {
    cards().forEach((c, i) => { if (!c.classList.contains("away")) c.dataset.depth = String(Math.max(0, i - index)); c.style.zIndex = String(10 - i); });
    $("counter").textContent = `${Math.min(index + 1, pack.length)} / ${pack.length}`;
  };
  layout();
  const top = () => cards()[index];
  const flipTop = () => {
    const btn = top(); if (!btn || btn.classList.contains("flipped")) return false;
    const p = pack.find((x) => x.id === btn.dataset.id);
    delete btn.dataset.depth; btn.classList.add("flipped"); SFX.flip();
    setTimeout(() => reveal(btn, p), 330);
    if (index === pack.length - 1) setTimeout(() => finish(pack), p.tier === "legend" ? 3600 : 1100);
    return true;
  };
  const dismissTop = (dir = -1) => {
    const btn = top(); if (!btn || !btn.classList.contains("flipped") || index >= pack.length - 1) return;
    btn.style.setProperty("--away", dir < 0 ? "-140%" : "140%"); btn.style.setProperty("--spin", dir < 0 ? "-18deg" : "18deg");
    btn.classList.add("away"); tone(330, 0, 0.08, "triangle", 0.06); index++; layout();
  };
  const tap = () => { if (!flipTop()) dismissTop(-1); };
  // drag the top card sideways to send it away
  let startX = null, moved = 0;
  $("stack").addEventListener("pointerdown", (e) => { if (!e.target.closest(".card")) return; startX = e.clientX; moved = 0; });
  $("stack").addEventListener("pointermove", (e) => {
    if (startX === null) return; const btn = top(); moved = e.clientX - startX;
    if (btn && btn.classList.contains("flipped") && index < pack.length - 1 && Math.abs(moved) > 6) {
      btn.classList.add("dragging"); btn.style.transform = `translateX(${moved}px) rotate(${moved / 14}deg) rotateY(180deg)`;
    }
  });
  const end = () => {
    if (startX === null) return; const btn = top(); startX = null;
    if (btn) { btn.classList.remove("dragging"); btn.style.transform = ""; }
    if (Math.abs(moved) > 70) dismissTop(Math.sign(moved)); else tap();
  };
  $("stack").addEventListener("pointerup", end); $("stack").addEventListener("pointercancel", () => { startX = null; });
  $("stack").addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); tap(); } });
  $("flip-all").addEventListener("click", () => {
    $("flip-all").hidden = true;
    const step = () => {
      const btn = top(); if (!btn) return;
      if (!btn.classList.contains("flipped")) { flipTop(); const p = pack.find((x) => x.id === btn.dataset.id); if (index < pack.length - 1) setTimeout(step, p.tier === "legend" ? 3400 : 1300); }
      else { dismissTop(-1); setTimeout(step, 500); }
    };
    step();
  });
}

function reveal(btn, p) {
  const [x, y] = center(btn);
  if (p.tier === "common") SFX.common();
  if (p.tier === "rare") { SFX.rare(); spray(x, y, 18, ["#39a8ff", "#bfe3ff"], 0.5); }
  if (p.tier === "epic") { SFX.epic(); buzz([40, 30, 60]); spray(x, y, 60, ["#b05cff", "#e2c4ff", "#ffffff"], 0.8); document.body.classList.add("shake-screen"); setTimeout(() => document.body.classList.remove("shake-screen"), 500); }
  if (p.tier === "legend") {
    SFX.legend(); buzz([80, 40, 120, 40, 200]);
    $("veil").classList.add("on"); $("rays").classList.add("on"); btn.classList.add("hero");
    document.body.classList.add("shake-screen"); setTimeout(() => document.body.classList.remove("shake-screen"), 500);
    spray(x, y, 160, ["#ffc93c", "#fff3c4", "#ff6ad5", "#94d0ff", "#ffffff"], 1.3);
    setTimeout(() => spray(x, y - 40, 90, ["#ffc93c", "#ffffff"], 1), 600);
    setTimeout(() => { $("veil").classList.remove("on"); $("rays").classList.remove("on"); btn.classList.remove("hero"); }, 3200);
  }
}

function finish(pack) {
  for (const p of pack) if (!S.owned.includes(p.id)) S.owned.push(p.id);
  S.streak += 1; S.opened = S.day;
  S.sinceLegend = pack.some((p) => p.tier === "legend") ? 0 : S.sinceLegend + 1;
  S.forceLegend = false; save(); header(); renderAlbum();
  const now = new Date(), mid = new Date(now); mid.setHours(24, 0, 0, 0);
  const left = Math.max(0, mid - now), hh = String(Math.floor(left / 3.6e6)).padStart(2, "0"), mm = String(Math.floor(left % 3.6e6 / 6e4)).padStart(2, "0");
  $("flip-all").hidden = true;
  for (const id of ["stack", "counter", "stack-hint"]) $(id).hidden = true; // the summary row replaces the big stack
  $("after").innerHTML = `<div class="summary">${pack.map((p) => cardHtml(p, false).replace('class="card ', 'class="card flipped ')).join("")}</div>
    <div class="after"><h2>今天收下 ${pack.length} 張新卡</h2><div class="next">下一包 ${hh}:${mm} 後</div>
    <div style="color:var(--soft);font-size:.85rem">收集進度 ${S.owned.length} / ${DATA.players.length}</div>
    <div class="actions"><button class="btn main" id="to-album">看收藏冊</button></div></div>`;
  $("to-album").addEventListener("click", () => document.querySelector(".album").scrollIntoView({ behavior: "smooth" }));
}

let albumTab = "all";
function renderAlbum() {
  const owned = new Set(S.owned);
  $("tabs").innerHTML = [{ key: "all", name: "全部", color: "var(--ink)" }, ...TIERS.slice().reverse()].map((t) => {
    const list = t.key === "all" ? DATA.players : byTier[t.key];
    const have = list.filter((p) => owned.has(p.id)).length;
    return `<button class="tab${albumTab === t.key ? " on" : ""}" style="--c:${t.color}" data-tab="${t.key}">${t.name} ${have}/${list.length}</button>`;
  }).join("");
  const list = (albumTab === "all" ? DATA.players : byTier[albumTab]).slice().sort((a, b) => a.no - b.no);
  $("grid").innerHTML = list.map((p) => owned.has(p.id)
    ? `<div class="mini t-${p.tier}" title="${esc(p.n)}"><span>#${String(p.no).padStart(3, "0")}</span><b>${esc(p.n)}</b><span>${tierOf(p.tier).name}</span></div>`
    : `<div class="mini locked"><span>#${String(p.no).padStart(3, "0")}</span><b>？？？</b><span>${tierOf(p.tier).name}</span></div>`).join("");
}
$("tabs").addEventListener("click", (e) => { const b = e.target.closest("[data-tab]"); if (b) { albumTab = b.dataset.tab; renderAlbum(); } });

function renderOdds() {
  $("odds").innerHTML = `<tr><th>等級</th><th>每張卡的機率</th><th>總張數</th></tr>` + TIERS.slice().reverse().map((t) =>
    `<tr style="--c:${t.color}"><td><span class="dot"></span>${t.name}</td><td>${Math.round(t.rate * 100)}%</td><td>${byTier[t.key].length}</td></tr>`).join("");
}

function startDay() {
  header();
  if (S.opened >= S.day) {
    $("stage").innerHTML = `<div class="after"><h2>今天的卡包已經開過了</h2><div class="next">明天見</div><p style="color:var(--soft)">試玩版可以按下方「跳到下一天」。</p></div>`;
  } else if (S.owned.length >= DATA.players.length) {
    $("stage").innerHTML = `<div class="after"><h2>🏆 全部 ${DATA.players.length} 張都收齊了</h2></div>`;
  } else showPacks();
}
$("next-day").addEventListener("click", () => { if (S.opened < S.day) S.streak = S.streak; S.day += 1; save(); startDay(); scrollTo({ top: 0, behavior: "smooth" }); });
$("force-legend").addEventListener("click", () => { S.forceLegend = true; if (S.opened >= S.day) S.day += 1; save(); startDay(); scrollTo({ top: 0, behavior: "smooth" }); });
$("reset").addEventListener("click", (e) => {
  if (e.currentTarget.dataset.armed !== "1") { e.currentTarget.dataset.armed = "1"; e.currentTarget.textContent = "再按一次確認"; return; }
  S = { user: "demo", day: 1, opened: 0, owned: [], streak: 0, sinceLegend: 0, forceLegend: false }; save();
  e.currentTarget.dataset.armed = ""; e.currentTarget.textContent = "清空收藏重來"; renderAlbum(); startDay();
});
$("sound").addEventListener("click", () => { sound = !sound; $("sound").setAttribute("aria-pressed", String(sound)); $("sound").textContent = sound ? "🔊 音效開" : "🔇 音效關"; });

renderOdds(); renderAlbum(); startDay();
</script>
</body>
</html>
