# 用途：Render 的 Blueprint 部署設定,讓 Render 自動讀這份檔案建立後端 Web
# Service,不用在網頁介面手動填 build/start command。細節見 server/README.md。
# DATABASE_URL 現在是 sync: false——資料庫早就從 Render 免費方案的 Postgres
# 搬到 Neon 了(2026-10,見 server/db.py 的 init_db() 註解),但這份檔案原本
# 還留著舊的 databases 區塊 + fromDatabase 綁定,結果這次 push 觸發 Blueprint
# 重新同步時,把手動設定的 Neon 連線字串整個覆蓋回舊的、已經 suspended 的
# Render Postgres,網站整個掛掉(瀏覽人次、登入都連帶壞掉)。sync: false 讓
# Render 只記得「這個變數存在」,實際值永遠留給 Dashboard 手動管理,
# Blueprint 同步不會再動它。
# 舊的 Render Postgres 已經在 Dashboard 手動刪除(2026-10),所以原本留著的
# databases 區塊也一併拿掉——留著的話,Blueprint 同步可能會照宣告重新建一個
# 沒人用的免費資料庫。
# 可手動調整的變數：plan(目前是 starter,每月 7 美元、不會閒置休眠;2026-10
# 從 free 升級,跟 Dashboard 上實際付費的方案一致,避免 Blueprint 同步時被改回
# free。要降回免費方案就改回 free)、
# PYTHON_VERSION(要跟本機開發用的 Python 版本一致,避免行為不一致)。
services:
  - type: web
    name: nba-player-template
    runtime: python
    plan: starter
    buildCommand: pip install -r server/requirements.txt
    startCommand: gunicorn --chdir server app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
